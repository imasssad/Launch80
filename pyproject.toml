[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "launch80"
version = "1.1.0"
description = "Risk-constrained Robinhood Chain/Solana new-pool profit-gated timed-exit bot"
requires-python = ">=3.11,<3.14"
dependencies = [
  "httpx>=0.27,<1.0", "python-dotenv>=1.0,<2.0",
  "fastapi>=0.110,<1.0", "uvicorn>=0.30,<1.0",
  "web3>=7.5,<8.0", "eth-account>=0.13,<1.0",
  "solders>=0.21,<1.0", "base58>=2.1,<3.0", "pyotp>=2.9,<3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2",
       "ruff>=0.6", "mypy>=1.10", "pip-audit>=2.7"]

[project.scripts]
launch80 = "launch80.main:main"

[tool.setuptools.packages.find]
include = ["launch80*"]

[tool.setuptools.package-data]
launch80 = ["web/*.html", "web/*.svg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff.lint]
# Bug-level rules only. The codebase's compact one-line style (E701/E702) is
# the author's; broad fail-closed `except Exception` blocks are deliberate.
select = ["E4", "E9", "F"]
