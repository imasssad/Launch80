<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Launch80">
  <!-- Same family as the console: dark rounded square, lime mark.
       The open arc is the 80-second hold timer; the arrow is the launch.
       Shapes stay legible at 16px, where a "80" wordmark turns to mush. -->
  <rect width="64" height="64" rx="15" fill="#0a1216"/>
  <circle cx="32" cy="32" r="20" fill="none" stroke="#bbf264" stroke-width="6"
          stroke-linecap="round" stroke-dasharray="94 32" transform="rotate(-108 32 32)"/>
  <path d="M32 43V23m0 0-8.5 8.5M32 23l8.5 8.5" fill="none" stroke="#bbf264"
        stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
